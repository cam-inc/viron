name: Publish NPM Package - Viron/lib

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - "packages/nodejs/**"
      # A lockfile-only fix must still reach this workflow. Re-running a
      # failed job checks out the original commit, so it cannot pick up a
      # later lockfile fix.
      - "package-lock.json"
      - ".github/workflows/publish-package-viorn-lib.yml"

permissions:
  id-token: write  # Required for OIDC
  contents: read
      
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          cache: "npm"
      - name: Update npm
        run: npm install -g npm@11.6.2
      - name: Install dependencies and Build
        run: |
          echo "Installing packages..."
          npm ci
          npm run build -w packages/linter
          npm run build -w packages/nodejs
      - name: Publish with OIDC
        run: |
          VERSION="$(node -p "require('./packages/nodejs/package.json').version")"
          if npm view "@viron/lib@${VERSION}" version >/dev/null 2>&1; then
            echo "@viron/lib@${VERSION} is already published. Skipping."
            exit 0
          fi
          echo "Publishing @viron/lib@${VERSION}..."
          npm publish -w packages/nodejs
